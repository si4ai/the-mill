# Test-selection map (card 1127). Read by ci/test_select.py in the ci.yml
# select job.
#
# Each path pattern maps to the test jobs that verify that file. A changed
# file selects the union of jobs from every rule it matches. A file that
# matches no rule selects no test job and never fails for being unlisted
# (docs, README.md, CHANGELOG.md, LICENSE, .gitattributes, .gitignore).
#
# The suites run once per change, on the pull request head, the run
# Validator's Pass measures. A pull request runs both suites, the whole
# tree, if any changed file selects a job here, and none if no file does
# (docs only). The merge queue never runs a suite: the select job passes
# when the queue base is an ancestor of the PR head (nothing merged ahead
# of the tested code) and fails otherwise, which turns the required
# pytest_sql and pytest_no_sql gates red. A pyproject.toml whose only changed lines are `version = "..."`
# counts as unchanged, so a release bump (that line plus CHANGELOG.md) runs
# no suite; any other pyproject.toml line, a dependency pin, still runs both.
#
# Schema:
#   [[rule]]
#   paths = ["repo-relative glob", ...]   "**" is zero or more directories
#   jobs  = ["job", ...]                  pytest_no_sql_run, pytest_sql_run
#
# build_pack, check_pack, mill_cli_smoke, precheck and hidden_code_report
# are not in this map: they scan or install the whole pack, commit messages
# and diff lines, so they run on every event, the merge queue included.
# A push to main or a v* tag (release.yml calls ci.yml) runs no suite:
# that code ran them on its PR. workflow_dispatch and an all-zero PR base
# run every job. The same code never runs the suites twice.
#
# To add a file pattern: put it in the rule whose jobs verify that file.
# A new SQL-marked test, or a tests/ or tools/ file one imports or loads
# by path, must be in a rule with pytest_sql_run, and any tracked file a
# test names by path must be in some rule; tests/ci/test_test_select.py
# fails if not.

# The pack, its build, its dependency pins and all SQL: both suites.
[[rule]]
paths = [
  "agent_coord/**",
  "build_backend/**",
  "pyproject.toml",
  "MANIFEST.in",
  "tools/ci-lock/*.txt",
  "**/*.sql",
]
jobs = ["pytest_no_sql_run", "pytest_sql_run"]

# Shared test helpers, the SQL suites and the modules they import.
[[rule]]
paths = [
  "tests/*.py",
  "tests/server/**",
  "tests/client/__init__.py",
  "tests/client/param_cases_238.py",
  "tests/client/param_gaps_238.py",
  "tests/programs/**",
  "tests/install/test_beta_080_cuts_868.py",
  "tests/install/test_invite.py",
  "tests/install/test_migrate_080_book.py",
  "tests/install/test_migrate_1059_watcher_name.py",
  "tests/install/test_migrate_1133_history.py",
  "tests/install/test_migrate_1163_retired.py",
  "tests/install/test_regression_rows_not_skipped_663.py",
  "tests/install/test_schema_invariants_868.py",
  "tests/install/test_sql_marker_guard_794.py",
  "tests/install/test_validator_pass_810.py",
  "tests/install/test_validator_status_identity_811.py",
  "tests/tools/test_precheck_959.py",
  "tests/tools/test_check_install_drift.py",
  "tools/check_install_drift.py",
  "tools/__init__.py",
  "tools/book_shape.py",
  "tools/check_pack.py",
  "tools/precheck.py",
  "tools/precheck.sh",
  "tools/probe_deleted_rows.py",
]
jobs = ["pytest_no_sql_run", "pytest_sql_run"]

# Everything else a non-SQL test reads: tests, tools, scripts, models,
# hooks, workflows and this selector.
[[rule]]
paths = [
  "tests/tools/test_check_hidden_code.py",
  "tests/tools/test_check_failure_classes.py",
  "**/*.py",
  "tests/**",
  "tests/tools/test_check_test_overlap.py",
  "tools/**",
  "tests/tools/test_check_dead_commands.py",
  "scripts/**",
  "tests/tools/test_check_flake_reruns.py",
  "verify/**",
  ".githooks/**",
  ".github/**",
  "ci/**",
  "Makefile",
]
jobs = ["pytest_no_sql_run"]

# A ci.yml change is proven by running every job it defines.
[[rule]]
paths = [".github/workflows/ci.yml"]
jobs = ["pytest_no_sql_run", "pytest_sql_run"]
