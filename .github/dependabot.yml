# Version updates, weekly. Turn on security updates in repo settings.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The hashed CI locks (#634); regenerate with the command in each header.
  - package-ecosystem: pip
    directory: /tools/ci-lock
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tools/wall-validators
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Service images used in workflows. Dependabot does not yet rewrite
  # services/container lines in Actions YAML (dependabot-core/5819),
  # so this Dockerfile carries the same pin as ci.yml pytest_sql (#763).
  - package-ecosystem: docker
    directory: /.github/docker/mysql
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
