# CodeQL code scanning (free on public repos): Python sources and the
# workflow files themselves.
# Card 1336: the job lives in the shared si4ai/.github codeql workflow,
# called at a full commit sha, with this repo's config file.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  # analyze is a required check on main, so it runs in the merge queue (#810).
  merge_group:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    uses: si4ai/.github/.github/workflows/codeql.yml@23c056780f193d140e042491ac81a59cafb71a14
    with:
      languages: '["python", "actions"]'
      config-file: ./.github/codeql/codeql-config.yml
