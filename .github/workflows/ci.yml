# The gate for every pull request, every merge-queue entry, every push to main
# and (through release.yml) every v* tag. The jobs are the required status checks on main.
# Rules: every action is pinned to a full commit SHA, no pull_request_target,
# no self-hosted runners (fork PRs on a public repo would run code on them),
# and every PyPI install is hash-checked: the pinned pip wheel, then a lock in
# tools/ci-lock/ with --require-hashes (#634). Local dist/ installs use
# --no-deps --no-build-isolation so they fetch nothing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the required checks on the queued squash commit (#810).
  merge_group:
  workflow_dispatch:
  # release.yml calls this file so a tag is gated by the same jobs.
  workflow_call:
    secrets:
      MILL_PRIVATE_NAMES:
        required: true

permissions:
  contents: read

concurrency:
  # Literal prefix: when called from release.yml, github.workflow is the caller.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_VERSION: "3.12"

jobs:
  build_pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # No cache on tag runs: a release must not restore a cache written by a branch.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pip' || '' }}
          cache-dependency-path: tools/ci-lock/*.txt
      - run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --require-hashes -r tools/ci-lock/build.txt
      # The backend comes from build.txt, not a fresh unhashed download; the
      # commit time dates the archive members, and the in-tree backend
      # (build_backend/mill_build.py) fixes times, owner and modes in both.
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python -m build --no-isolation
      # F78: two more builds of this commit (fresh clones, umask 022 and 002,
      # later times) must match dist/ byte for byte.
      - run: python tools/check_repro.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  check_pack:
    needs: build_pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the commit-message scans start at a cut older than any
          # shallow depth, and check_pack fails closed on a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pip' || '' }}
          cache-dependency-path: tools/ci-lock/*.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --require-hashes -r tools/ci-lock/ci.txt
      # The private-name list (#339) comes from a secret, in env only: never
      # echoed or written to a file. A fork PR has no secrets, so it skips and
      # says so; the push to main scans again. Anything else without it fails.
      - env:
          MILL_PRIVATE_NAMES: ${{ secrets.MILL_PRIVATE_NAMES }}
          MILL_PRIVATE_NAMES_REQUIRED: ${{ github.event.pull_request.head.repo.fork && '0' || '1' }}
        run: python tools/check_pack.py dist
      # In the merge queue HEAD is the squash commit GitHub puts on main as
      # is: scan that message alone with every message rule (#810, F109).
      - if: github.event_name == 'merge_group'
        env:
          MILL_PRIVATE_NAMES: ${{ secrets.MILL_PRIVATE_NAMES }}
        run: python tools/check_pack.py --head-message
      # On a pull request every commit that would reach main (A..B) is scanned:
      # message, author/committer identity, and added diff lines (card 935, F225).
      # Release branches land as merge commits, so each of those commits is kept.
      - if: github.event_name == 'pull_request'
        env:
          MILL_PRIVATE_NAMES: ${{ secrets.MILL_PRIVATE_NAMES }}
          MILL_PRIVATE_NAMES_REQUIRED: ${{ github.event.pull_request.head.repo.fork && '0' || '1' }}
        run: |
          git fetch --no-tags origin main
          python tools/check_pack.py --commits origin/main..HEAD
      # Whole-tree comment and prose hygiene, the same scan as the pre-commit hook.
      - run: python tools/precommit_hygiene.py tree
      # Audit without installing anything: the runtime floors (the oldest a
      # user's install may keep) and the locked set CI tests.
      - run: python tools/write_pack_deps.py
      - run: pip-audit --disable-pip --no-deps -r pack-floors.txt
      - run: pip-audit --disable-pip --require-hashes -r tools/ci-lock/ci.txt

  mill_cli_smoke:
    needs: build_pack
    # Pinned image, not ubuntu-latest: 24.04 ships OpenSSL 3.0, the case the
    # C-driver restart fix exists for.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pip' || '' }}
          cache-dependency-path: tools/ci-lock/*.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --require-hashes -r tools/ci-lock/ci.txt
      - run: python -m pip install --no-deps --no-build-isolation dist/the_mill-*.tar.gz
      - run: python -m pip check
      - run: python tools/mill_cli_smoke.py
      # F34: the built env must run the book on the connector's C extension.
      - run: test "$(uname -m)" = "x86_64"
      - run: python -m agent_coord.server.records.driver --require-c
      - run: python tools/check_skill_copy.py --installed
      # F90: every mill command and flag the docs teach is one the parser takes.
      - run: python tools/check_doc_commands.py

  pytest_no_sql:
    needs: build_pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Node 24.21.0 is the desk runtime. html-validate needs ^22.22 or >=24.8.
      NODE_VERSION: v24.21.0
      NODE_SHA256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the pack-check tests scan commit messages, and a
          # shallow clone fails closed.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pip' || '' }}
          cache-dependency-path: tools/ci-lock/*.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install Node (official tarball, sha256 checked)
        run: |
          set -eu
          test "$(uname -m)" = "x86_64"
          tarball="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL --retry 5 --retry-all-errors -o "$tarball" \
            "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - run: test "$(node -v)" = "$NODE_VERSION"
      - run: npm ci --prefix tools/wall-validators
      - run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --require-hashes -r tools/ci-lock/ci.txt
      - run: python -m pip install --no-deps --no-build-isolation dist/the_mill-*.tar.gz
      - run: python -m pip check
      - run: python -m pytest tests -m "not sql"

  pytest_sql:
    needs: build_pack
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      # One throwaway MySQL per job. The job runs on the VM, so the service is
      # reached on 127.0.0.1 through the mapped port, not by a service alias.
      # The password is a CI-only value for this disposable container.
      mysql:
        # digest for mysql:8.4 (library/mysql) as of 2026-10-30; dependabot docker bumps it (#763)
        image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AGENT_COORD_HOST: 127.0.0.1
      AGENT_COORD_USER: root
      AGENT_COORD_PASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the pack-check tests scan commit messages, and a
          # shallow clone fails closed.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pip' || '' }}
          cache-dependency-path: tools/ci-lock/*.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --require-hashes -r tools/ci-lock/ci.txt
      - run: python -m pip install --no-deps --no-build-isolation dist/the_mill-*.tar.gz
      - run: python -m pip check
      - name: Wait for MySQL
        shell: python
        run: |
          import sys, time, mysql.connector
          last = None
          for _ in range(30):
              try:
                  mysql.connector.connect(host="127.0.0.1", user="root", password="root", connection_timeout=5).close()
                  sys.exit(0)
              except Exception as e:
                  last = e
                  time.sleep(2)
          sys.exit("mysql not ready: %s" % last)
      - run: python -m pytest tests -m sql -n 2 --dist loadfile

  precheck:
    needs: build_pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pip' || '' }}
          cache-dependency-path: tools/ci-lock/*.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --require-hashes -r tools/ci-lock/ci.txt
      - run: python -m pip install --no-deps --no-build-isolation dist/the_mill-*.tar.gz
      - name: Fetch main for diff base
        run: git fetch --no-tags origin main
      # Card 959 / F-precheck: cheap checks before a Pass ask. Pack scan is
      # already the check_pack job; skip the nested rebuild here.
      - run: ./tools/precheck.sh HEAD --skip-pack
