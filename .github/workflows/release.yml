# Ship path on GitHub. PyPI trusted publishing (OIDC): no stored token.
# The PyPI publisher is bound to this file name and the environment name, so
# renaming release.yml or the environments breaks publishing.
#   push v* tag        -> ci gates -> verify -> publish to PyPI (env: pypi)
#   workflow_dispatch  -> ci gates -> verify (dry run, publishes nothing)
# PyPI gets the same dist/ that ci built and check_pack scanned.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    # The private-name list for check_pack (#339); not a credential.
    secrets:
      MILL_PRIVATE_NAMES: ${{ secrets.MILL_PRIVATE_NAMES }}

  verify:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # F207 (#762): a v* tag off main must not publish. fetch-depth 0 is set;
      # fetch origin/main and require the tagged SHA is an ancestor of it.
      - name: Tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG_SHA" origin/main
      - name: Tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          want="${REF_NAME#v}"
          ls "dist/the_mill-${want}-py3-none-any.whl" "dist/the_mill-${want}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" = 2
      - run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --require-hashes -r tools/ci-lock/ci.txt
      - env:
          MILL_PRIVATE_NAMES: ${{ secrets.MILL_PRIVATE_NAMES }}
        run: python tools/check_pack.py dist
      - run: python tools/precommit_hygiene.py tree
      - run: python -m twine check --strict dist/*
      # F78: rebuild the tagged commit twice; PyPI gets these bytes only if
      # both rebuilds match dist/ (ci.txt pins the same build tools as build.txt).
      - run: python tools/check_repro.py dist
      # Card 960 / F-gate-fastpath: when PASSED_SHA is set and its tree equals
      # this tag's tree, the gate script confirms the match and byte-compares
      # dist/ against one rebuild; otherwise it reports full path was required.
      - name: Release gate tree-equal fast path
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PASSED_SHA: ${{ vars.MILL_PASSED_SHA }}
        run: |
          set -eu
          if [ -z "${PASSED_SHA:-}" ]; then
            echo "gate: no PASSED_SHA; full path already ran above"
            exit 0
          fi
          python tools/release_gate.py --passed "$PASSED_SHA" --head "$GITHUB_SHA" --dist dist

  publish_pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/the-mill/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # v1.14.3 (#634 review): its image carries pip 26.2, but pip runs only at
      # image build, against hash constraints; the upload (twine, id, sigstore,
      # requests) trusts the image's certifi 2026.10.19, which has no emSign
      # ECC G3 root. PEP 740 attestations are on by default.
      # F208 (#761): the composite action pulls
      # ghcr.io/pypa/gh-action-pypi-publish:<action-sha> (mutable registry tag).
      # Resolve it and refuse unless the digest matches the pin on the uses line;
      # bump ACTION_SHA, WANT_DIGEST and the uses pin together.
      - name: Publish image digest matches pin
        env:
          ACTION_SHA: "7245906fb61fa33a13554f9d5fb856fe61758086"
          WANT_DIGEST: "sha256:411241df99067c98b6d08fd8e26d14e86740a22460599c2af571e6dc26e27ffc"
        run: |
          set -eu
          token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:pypa/gh-action-pypi-publish:pull" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          got=$(curl -fsSI \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/pypa/gh-action-pypi-publish/manifests/${ACTION_SHA}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2; exit}')
          test -n "$got"
          test "$got" = "$WANT_DIGEST"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 image sha256:411241df99067c98b6d08fd8e26d14e86740a22460599c2af571e6dc26e27ffc
