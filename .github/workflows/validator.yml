# The Validator gate (#810, F110). The merge queue requires the validator_pass
# check: on merge_group it passes only when every PR in the queue entry has a
# `validator` success status on its head sha. On pull_request it reports the
# state and passes, so a PR can wait for its PASS without a red check.
# Kept out of ci.yml: release.yml calls ci.yml with contents read only.
# Card 1336: the job lives in the shared si4ai/.github validator workflow,
# called at a full commit sha; it checks its script out at that same sha.
name: validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: validator-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validator_pass:
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: si4ai/.github/.github/workflows/validator.yml@23c056780f193d140e042491ac81a59cafb71a14
