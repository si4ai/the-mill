# PR and issue text hygiene (#723, F94). GitHub keeps every revision of a PR
# or issue body in its edit history, so text is scanned when it is posted.
# The text is untrusted input: the shared check_pr_text.py reads it from the
# event JSON file or the API. No workflow expression puts event text into a shell
# line. Same rules as the commit-message scan, read-only token, no secrets,
# checkout pinned to a full SHA, system Python, nothing installed.
# No review events (#823, F122): a review by a bot (Copilot's automatic review,
# even one that fails on quota) starts a run GitHub holds for a maintainer's
# approval, and a bot review must never hold or delay a merge. The sweep reads
# every review body and review comment instead.
# Card 1336: the jobs live in the shared si4ai/.github pr_text workflow,
# called at a full commit sha; it checks its scripts out at that same sha,
# so a PR cannot change the checker that scans it.
name: pr_text

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-text-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr_text:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: si4ai/.github/.github/workflows/pr_text.yml@23c056780f193d140e042491ac81a59cafb71a14
