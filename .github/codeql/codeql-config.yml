name: mill-codeql
# Card 1273: the two stock clear-text queries do not know the mill redactor.
# The mill/cleartext-redactor pack extends their sanitizer class and is the
# one that runs. query-filters match query metadata only (id, tags, ...); a
# paths key under exclude does not scope an exclude to one file, so the old
# log_rotate.py filter was not a path filter. log_rotate copytruncate is
# instead a sanitizer in the replacement storage query, with a reason there.
queries:
  - name: mill-cleartext-redactor
    uses: ./.github/codeql/mill-cleartext
query-filters:
  - exclude:
      id: py/clear-text-logging-sensitive-data  # replaced by mill/cleartext-redactor
  - exclude:
      id: py/clear-text-storage-sensitive-data  # replaced by mill/cleartext-redactor
